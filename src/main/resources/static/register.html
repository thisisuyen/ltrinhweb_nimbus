<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Đăng ký</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h4 class="mb-0">
                        Đăng ký tài khoản
                    </h4>

                </div>

                <div class="card-body">

                    <div
                        id="message"
                        class="alert d-none">
                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Họ tên
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control">

                    </div>

                    <button
                        id="btnRegister"
                        class="btn btn-success w-100">

                        Đăng ký

                    </button>

                    <div class="text-center mt-3">

                        Đã có tài khoản?

                        <a href="/login.html">
                            Đăng nhập
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="/js/register.js"></script>

</body>
</html>
