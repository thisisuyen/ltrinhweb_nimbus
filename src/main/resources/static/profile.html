<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand">
            JWT Nimbus Demo
        </span>

        <button
            id="btnLogout"
            class="btn btn-danger">

            Đăng xuất

        </button>

    </div>

</nav>


<div class="container mt-5">

    <div
        id="error"
        class="alert alert-danger d-none">
    </div>


    <div class="card shadow">

        <div class="card-header">

            <h4>
                Thông tin người dùng
            </h4>

        </div>


        <div class="card-body">

            <p>
                <strong>ID:</strong>
                <span id="id"></span>
            </p>

            <p>
                <strong>Họ tên:</strong>
                <span id="fullName"></span>
            </p>

            <p>
                <strong>Email:</strong>
                <span id="email"></span>
            </p>

            <p>
                <strong>Ngày tạo:</strong>
                <span id="createdAt"></span>
            </p>

            <hr>

            <h6>JWT hiện tại</h6>

            <textarea
                id="token"
                class="form-control"
                rows="6"
                readonly>
            </textarea>

        </div>

    </div>


    <div class="card shadow mt-4">

        <div class="card-header">

            <h4>
                Danh sách Users
            </h4>

        </div>

        <div class="card-body">

            <button
                id="btnUsers"
                class="btn btn-primary mb-3">

                Load Users

            </button>

            <table class="table table-bordered">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                </tr>

                </thead>

                <tbody id="users"></tbody>

            </table>

        </div>

    </div>

</div>

<script src="/js/profile.js"></script>

</body>
</html>
